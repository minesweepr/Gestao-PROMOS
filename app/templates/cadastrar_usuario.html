{% extends "base.html" %}

{% block estilo %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
{% endblock %}

{% block conteudo %}
<form id="formCadastro" class="card-branco card-largo" method="POST">
    <h2>Cadastrar Usuário</h2>
    
    <!-- Campos Comuns -->
    <section>
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" placeholder="Digite o nome completo" required />
    </section>

    <section>
        <label for="cpf">CPF (apenas 11 números):</label>
        <input type="text" name="cpf" id="cpf" placeholder="Digite os 11 dígitos do CPF" maxlength="11" required pattern="\d{11}" title="Digite exatamente 11 números." />
    </section>

    <section>
        <label for="cargo">Perfil / Cargo:</label>
        <select name="perfil" id="cargo" onchange="alternarCampos()" required>
            <option value="" disabled selected>Selecione o Cargo ou Perfil</option>
            <option value="ADMINISTRADOR">Administrador (Usuário)</option>
            <option value="PERSONAL">Estagiário / Personal (Usuário)</option>
            <option value="ALUNO">Aluno</option>
        </select>
    </section>

    <!-- BLOCO EXCLUSIVO: ALUNO -->
    <article id="info-aluno" style="display: none;">
        <section>
            <label for="telefone">Telefone:</label>
            <input type="text" name="telefone" id="telefone" placeholder="Digite o telefone" />
        </section>

        <section>
            <label for="email_aluno">E-mail do Aluno:</label>
            <input type="email" name="email_aluno" id="email_aluno" placeholder="Digite o e-mail (opcional)" />
        </section>

        <section>
            <label for="dnasc">Data de Nascimento:</label>
            <input type="date" name="dnasc" id="dnasc" />
        </section>

        <section>
            <label for="tipo_aluno">Tipo de Aluno:</label>
            <select name="tipo_aluno" id="tipo_aluno">
                <option value="" disabled selected>Selecione o Tipo de Aluno</option>
                <option value="PAGA_INTEIRA">Paga Inteira</option>
                <option value="PAGA_MEIA">Paga Meia</option>
                <option value="GRATUIDADE">Gratuidade</option>
            </select>
        </section>
    </article>

    <!-- BLOCO EXCLUSIVO: USUÁRIO DO SISTEMA -->
    <article id="info-funcionario" style="display: none;">
        <section>
            <label for="email">E-mail do Sistema:</label>
            <input type="email" name="email" id="email" placeholder="Digite o e-mail de acesso" />
        </section>

        <section>
            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" placeholder="Mínimo 6 caracteres" minlength="6" />
        </section>
    </article>

    <section>
        <button type="button" class="btn-preto" onclick="window.history.back()">Cancelar</button>
        <button type="submit" class="btn-vermelho">Cadastrar</button>
    </section>
</form>

<script>
function alternarCampos() {
    const valorSelecionado = document.getElementById('cargo').value;
    const infoAluno = document.getElementById('info-aluno');
    const infoFuncionario = document.getElementById('info-funcionario');

    infoAluno.style.display = 'none';
    infoFuncionario.style.display = 'none';

    if (valorSelecionado === 'ALUNO') {
        infoAluno.style.display = 'block';
    } else if (valorSelecionado === 'ADMINISTRADOR' || valorSelecionado === 'PERSONAL') {
        infoFuncionario.style.display = 'block';
    }
}

document.getElementById('formCadastro').addEventListener('submit', async function(e) {
    e.preventDefault();

    const formData = new FormData(this);

    try {
        const resposta = await fetch("{{ url_for('cadastrar_usuario') }}", {
            method: 'POST',
            body: formData
        });

        const resultado = await resposta.json();

        alert(resultado.mensagem);

        if (resultado.sucesso) {
            this.reset();
            alternarCampos();
        }
    } catch (erro) {
        alert("Erro de conexão ao tentar cadastrar: " + erro);
    }
});
</script>
{% endblock %}
