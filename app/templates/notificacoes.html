<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão PROMO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block estilo %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notificacoes.css') }}">
    {% endblock %}
</head>
<body class="bg-branco">

<header class="flx bg-branco">
    <a href="/presenca">
        <i class="fa-solid fa-chevron-left"></i>
    </a>

    <div class="center-flx">
        <i class="fa-regular fa-bell"></i>
        <h1>Notificações</h1>
        <p id="contador-nao-lidas" class="accent-notif">{{ nao_lidas }} não lidas</p> 
    </div>
    <div></div>
</header>
<main>
    {% block conteudo %}
    {% for alerta in alertas %}
    <article class="card-largo notificacao" data-id="{{ alerta.id_alerta }}"> 
        <div class="center-flx notif-content">
            <i class="fa-solid fa-exclamation"></i>

            <div>
                <p class="notificacao-titulo {% if alerta.status == 'PENDENTE' %}unread{% endif %}">{{ alerta.tipo_alerta }}</p>
                <p class="notificacao-desc">{{ alerta.descricao_exibida }}</p>
            </div>
            <span class="status-notificacao {% if alerta.status != 'PENDENTE' %}display-notif{% endif %}">
                <i class="fa-regular {% if alerta.status == 'PENDENTE' %}fa-envelope-open{% else %}fa-envelope{% endif %} icone-status"></i>
                <span class="status-notificacao-bolinha {% if alerta.status != 'PENDENTE' %}display-notif{% endif %}"></span>
            </span>
        </div>
    </article>
    {% endfor %}
    {% endblock %}
</main>

<script>

document.querySelectorAll('.notificacao').forEach(card => {
    card.addEventListener('click', async () => {
        const indicador = card.querySelector('.status-notificacao');
        const bolinha = card.querySelector('.status-notificacao-bolinha');
        const titulo = card.querySelector('.notificacao-titulo');
        const icone = card.querySelector('.icone-status');
        const status = titulo.classList.contains('unread') ? 'VISUALIZADO' : 'PENDENTE';

        try {
            const resposta = await fetch(
                `/notificacoes/${card.dataset.id}/visualizar`,
                {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                }
            );

            if (!resposta.ok) {
                console.error('Erro ao atualizar notificação:', resposta.status);
                return;
            }

            indicador.classList.toggle( 'display-notif', status === 'VISUALIZADO' );
            bolinha.classList.toggle( 'display-notif', status !== 'PENDENTE' );
            titulo.classList.toggle('unread', status === 'PENDENTE');
            icone.classList.remove('fa-envelope', 'fa-envelope-open');
            icone.classList.add( status === 'PENDENTE' ? 'fa-envelope-open' : 'fa-envelope' );
        } catch (erro) {
            console.error('Erro ao atualizar notificação:', erro);
        }
    });
});

</script>
</body>
</html>
