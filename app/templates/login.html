<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão PROMO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block estilo %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/filtros.css') }}">
    <style>
        main {
            height: 100vh; 
            padding: 0 2.6rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        label {
            display: none;
        }
        h1 {
            margin-bottom: 4rem;
        }
        button {
            margin: 2.4rem 0;
            width: 100%;
            max-width: 400px;
            filter: drop-shadow(0px 2px 5px rgb(0,0,0,0.20));
        }
        input::placeholder {
            font-size: 1.15rem;
        }
        .input-flex {
            margin: 8px 0 16px 0;
            max-width: 400px;
        }
        input[type="text"], 
        input[type="password"], 
        input[type="email"]{
            min-width: auto;
        }
        i.fa-solid {
            color: black;
        }
    </style>
    {% endblock %}
</head>
<body class="bg-branco">

<main>
    {% block conteudo %}
        <h1>Login</h1>

        <div id="email" class="input input-flex">
            <input type="text" name="email" id="email" placeholder="E-mail" />
            <i class="fa-solid fa-user"></i>
        </div>
        <div id="senha" class="input input-flex">
            <input type="password" name="senha" id="senha" placeholder="Senha" />
            <i class="fa-solid fa-lock"></i>
        </div>
        <button class="btn-vermelho" onclick="window.location.href='/presenca'">Entrar</button>
    {% endblock %}
</main>


</body>
</html>
